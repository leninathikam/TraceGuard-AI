[project]
name = "traceguard"
version = "0.1.0"
description = "AI reliability engineer for AI agents: detect, diagnose and verify repairs of agent failures with NVIDIA Nemotron on Nebius Token Factory."
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "fastapi>=0.110",
  "uvicorn>=0.27",
  "pydantic>=2.6",
  "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p no:cacheprovider"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.setuptools.packages.find]
include = ["traceguard*"]

[tool.setuptools.package-data]
traceguard = ["scenarios/**/*"]
